services:
  chuydex_mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-chuydex_db}
      MYSQL_USER: ${DB_USER:-chuydex_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports: ["${DB_PORT:-3306}:3306"]
    volumes: ["chuydex_mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
  chuydex_api:
    build: .
    environment:
      DB_HOST: chuydex_mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-chuydex_db}
      DB_USER: ${DB_USER:-chuydex_user}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
    ports: ["${PORT:-3000}:3000"]
    depends_on:
      chuydex_mysql:
        condition: service_healthy
volumes:
  chuydex_mysql_data:
