services:
  chuydex_mysql_e2e:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: chuydex_e2e
      MYSQL_USER: ${DB_USER:-chuydex_e2e_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-chuydex_e2e_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-chuydex_e2e_root_password}
    ports:
      - "${DB_PORT:-3307}:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-chuydex_e2e_root_password}"]
      interval: 5s
      timeout: 5s
      retries: 24
